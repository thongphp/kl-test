name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      # Must happen BEFORE `docker compose up`: env_file is read when the container is
      # created, and an empty APP_KEY injected at that point would beat a key that is
      # generated into .env afterwards.
      - name: Create .env from .env.example
        run: |
          set -e
          if [ ! -f .env.example ]; then
            echo ".env.example not found"
            exit 1
          fi
          cp .env.example .env

          # .env.example already points at the compose services (db, redis);
          # only the app key needs to be generated.
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          echo ".env created from .env.example"

      - name: Build and start containers
        run: |
          # --wait blocks until db/redis are healthy and app is running, and fails on timeout
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps

      # ./ is bind-mounted over /var/www/html, so vendor/ from the image build is hidden
      - name: Install PHP dependencies
        run: |
          docker compose exec -T app composer install --no-interaction --prefer-dist --no-progress

      - name: Check app container
        run: |
          docker compose exec -T app php -m | grep -i zip
          docker compose exec -T app php artisan --version

      - name: Run migrations & seed
        run: |
          set -e
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force

      # Tests run on their own database (created by docker/postgres/init) so they never wipe the dev DB
      - name: Run tests
        run: |
          docker compose exec -T -e DB_DATABASE=kl_test_testing app php artisan test --no-interaction

      # Real parallel requests against PostgreSQL (Phase 9)
      - name: Run concurrency & PostgreSQL tests
        run: |
          docker compose exec -T -e DB_DATABASE=kl_test_testing app php artisan test tests/Concurrency --no-interaction

      - name: Save docker-compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color > compose-logs.txt || true
          echo "==== docker-compose logs ===="
          cat compose-logs.txt

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
