version: '3.9'

services:
  app:
    container_name: kltest_app
    build:
        context: .
        dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    ports:
      - '9000:9000'
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: kltest_db
    environment:
      POSTGRES_DB: kl_test
      POSTGRES_USER: kl_user
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kl_user} -d ${POSTGRES_DB:-kl_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: kltest_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  db_data:
  redis_data:

networks:
  app-network:
    driver: bridge
