services:
  app:
    container_name: kltest_app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '9000' # php-fpm (FastCGI), internal only. HTTP is served by `web`.
    networks:
      - app-network

  web:
    image: nginx:1.27-alpine
    container_name: kltest_web
    depends_on:
      - app
    ports:
      - '9000:80' # http://localhost:9000
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

  db:
    image: postgres:18-alpine
    container_name: kltest_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kl_test}
      POSTGRES_USER: ${DB_USERNAME:-kl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kl_user} -d ${DB_DATABASE:-kl_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: kltest_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  db_data:
    driver: local
    name: db_data
  redis_data:

networks:
  app-network:
    driver: bridge
